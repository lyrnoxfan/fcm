name: FocusGuard isolated Android smoke
on:
  workflow_dispatch:
  push:
    branches: [fcm/ui-permissions-unbinding, fcm/auto-register-http]
    paths: ['android/**', 'backend/**', 'ci/**', '.github/workflows/android-isolated.yml']
permissions:
  contents: read
jobs:
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select emulator acceleration
        id: acceleration
        run: |
          if [ ! -c /dev/kvm ]; then sudo modprobe kvm_intel || true; fi
          if [ -c /dev/kvm ]; then
            ls -l /dev/kvm
            sudo chmod a+rw /dev/kvm
          fi
          options='-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'Using accessible KVM device'
          else
            echo 'No accessible KVM; using software emulation'
            options="$options -accel off"
          fi
          echo "options=$options" >> "$GITHUB_OUTPUT"
      - name: Prepare disposable HTTP backend and Android debug APK
        run: bash ci/android-smoke-prepare.sh
      - name: Run on an isolated Android 15 emulator
        env:
          FOCUSGUARD_SMOKE_REBOOT: "1"
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 600
          emulator-options: ${{ steps.acceleration.outputs.options }}
          script: python3 -u ci/android-smoke.py
