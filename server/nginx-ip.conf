# IP + port access (no DNS, no TLS): the user's phone cannot reliably reach
# the domains, so the console and the API are also served as plain HTTP on
# the server IP. The domain :8443 endpoints (nginx-api.conf / nginx-web.conf)
# stay in place as well.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/fcm;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
