server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fcm.lyrnox.com;

    ssl_certificate /etc/nginx/certs/fcm/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fcm/privkey.pem;

    root /var/www/fcm;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name fcm.lyrnox.com;
    return 301 https://$host$request_uri;
}
