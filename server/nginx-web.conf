server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name fcm.lyrnox.com;

    ssl_certificate /etc/nginx/certs/fcm/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fcm/privkey.pem;

    root /var/www/fcm;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
